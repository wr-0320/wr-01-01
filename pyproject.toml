[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcl-paper"
version = "0.1.0"
description = "Reliability-conditioned mixture likelihood research for contaminated multi-source observations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29,<2",
    "numpy>=1.24",
    "pettingzoo>=1.24,<2",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["deception_rl*", "models*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
